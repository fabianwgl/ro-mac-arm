name: CI

# GitHub-hosted macOS runners cannot run Docker, so the rAthena integration
# test is local-only. See docs/port/DOCKER.md.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS arm64)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache DerivedData and Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            Packages/*/.build
          key: "${{ runner.os }}-xcode-${{ hashFiles('**/Package.resolved') }}"
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build
        run: |
          xcodebuild \
            -project RagnarokOffline.xcodeproj \
            -scheme RagnarokOffline \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-tests:
    name: 'Unit tests (${{ matrix.package }})'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - BinaryIO
          - DataCompression
          - RagnarokConstants
          - RagnarokCore
          - RagnarokFileFormats
          - RagnarokGRF
          - RagnarokLocalization
          - RagnarokModels
          - RagnarokNetwork
          - RagnarokPackets
          - RagnarokResources
          - RagnarokScript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            Packages/*/.build
          key: "${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}"
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run package tests
        run: 'swift test --package-path "Packages/${{ matrix.package }}"'
